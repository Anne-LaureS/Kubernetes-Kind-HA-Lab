apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-elasticsearch-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  elasticsearch-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: "Elasticsearch"
      type: elasticsearch
      access: proxy
      url: http://elasticsearch.monitoring.svc.cluster.local:9200
      jsonData:
        timeField: "@timestamp"
        index: "metricbeat-8.12.0"
